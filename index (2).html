  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;

        const text = pageTexts[uuid];

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        // request spray; past the cap (far above any real page count) new

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

c-for><\u002Fdiv>\n\n<sc-if value=\"{{ rep.showCycle }}\">\n<div style=\"font-family:'Young Serif',serif;font-size:15px;color:#2B2320;margin-top:22px\">Cycles side by side<\u002Fdiv>\n<div style=\"font-size:11.5px;color:#6E6259;margin-top:2px;line-height:1.4;text-wrap:pretty\">One row per cycle, aligned on day 1 of your period. Pale cells weren’t logged. The band above each grid shows your typical phases.<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px\"><sc-for list=\"{{ rep.c.legend }}\" as=\"l\" hint-placeholder-count=\"4\"><span style=\"display:flex;align-items:center;gap:5px;font-size:10.5px;color:#4A3F39\"><span style=\"width:10px;height:10px;border-radius:2px;background:{{ l.c }}\"><\u002Fspan>{{ l.n }}<span style=\"color:#8A7E74\">{{ l.d }}<\u002Fspan><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:38px minmax(0,1fr) 24px;gap:4px;margin-top:12px\"><span style=\"font-size:9px;color:#8A7E74\">Day<\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(35,minmax(0,1fr));gap:1px\"><sc-for list=\"{{ rep.c.ruler }}\" as=\"d\" hint-placeholder-count=\"35\"><span style=\"font-size:8.5px;color:#6E6259;white-space:nowrap;overflow:visible\">{{ d.t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><span><\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ rep.c.mats }}\" as=\"m\" hint-placeholder-count=\"4\">\n<div data-avoid=\"\" style=\"margin-top:12px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><span style=\"font-size:12px;font-weight:600\">{{ m.title }}<\u002Fspan><span style=\"font-size:10px;color:#8A7E74;text-align:right\">{{ m.note }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:38px minmax(0,1fr) 24px;gap:4px;margin-top:5px;align-items:center\"><span><\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(35,minmax(0,1fr));gap:1px\"><sc-for list=\"{{ rep.c.band }}\" as=\"b\" hint-placeholder-count=\"35\"><div style=\"height:4px;background:{{ b.bg }}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv><span><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px;margin-top:2px\">\n<sc-for list=\"{{ m.rows }}\" as=\"row\" hint-placeholder-count=\"6\">\n<div style=\"display:grid;grid-template-columns:38px minmax(0,1fr) 24px;gap:4px;align-items:center\">\n<span style=\"font-size:9.5px;color:#6E6259;white-space:nowrap\">{{ row.label }}<\u002Fspan>\n<div style=\"display:grid;grid-template-columns:repeat(35,minmax(0,1fr));gap:1px\"><sc-for list=\"{{ row.cells }}\" as=\"c\" hint-placeholder-count=\"35\"><div style=\"height:9px;border-radius:1.5px;background:{{ c.bg }}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<span style=\"font-size:9.5px;color:#8A7E74;text-align:right\">{{ row.len }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ rep.showMig }}\">\n<div style=\"font-family:'Young Serif',serif;font-size:15px;color:#2B2320;margin-top:22px\">The week before<\u002Fdiv>\n<div style=\"font-size:11.5px;color:#6E6259;margin-top:2px;line-height:1.4;text-wrap:pretty\">Average for each day leading up to a migraine. Dashed line = your usual level on other days.<\u002Fdiv>\n<sc-for list=\"{{ rep.m.lead }}\" as=\"row\" hint-placeholder-count=\"3\">\n<div data-avoid=\"\" style=\"display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px;align-items:end;margin-top:12px\">\n<div><div style=\"font-size:11.5px;font-weight:600\">{{ row.label }}<\u002Fdiv><div style=\"font-size:10px;color:#8A7E74\">usual {{ row.base }}<\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative;height:44px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;align-items:end;border-bottom:1px solid #E3D9CB\">\n<sc-for list=\"{{ row.bars }}\" as=\"b\" hint-placeholder-count=\"8\"><div style=\"display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px\"><span style=\"font-size:9px;color:#6E6259\">{{ b.v }}<\u002Fspan><div style=\"width:100%;height:{{ b.h }};background:{{ b.c }};border-radius:3px 3px 0 0\"><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<div style=\"position:absolute;left:0;right:0;bottom:{{ row.baseH }};border-top:1.5px dashed rgba(43,35,32,.5)\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px;margin-top:4px\"><span><\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px\"><sc-for list=\"{{ rep.m.dayLabels }}\" as=\"d\" hint-placeholder-count=\"8\"><span style=\"font-size:9.5px;color:#8A7E74;text-align:center\">{{ d.t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<sc-if value=\"{{ rep.m.hasThemes }}\">\n<div style=\"font-family:'Young Serif',serif;font-size:15px;color:#2B2320;margin-top:22px\">Mentioned in your notes<\u002Fdiv>\n<div style=\"font-size:11.5px;color:#6E6259;margin-top:2px;line-height:1.4;text-wrap:pretty\">Themes found in diary and free-text entries in the 7 days before each migraine.<\u002Fdiv>\n<div data-avoid=\"\" style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\"><sc-for list=\"{{ rep.m.themes }}\" as=\"t\" hint-placeholder-count=\"4\"><div style=\"display:grid;grid-template-columns:120px minmax(0,1fr) 40px;gap:8px;align-items:center\"><span style=\"font-size:12px\">{{ t.label }}<\u002Fspan><div style=\"height:8px;border-radius:4px;background:#F1EBE2\"><div style=\"height:100%;width:{{ t.w }};border-radius:4px;background:#7B5C8E\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:11px;color:#6E6259;text-align:right\">{{ t.txt }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"font-family:'Young Serif',serif;font-size:15px;color:#2B2320;margin-top:22px\">Each migraine<\u002Fdiv>\n<div style=\"font-size:11.5px;color:#6E6259;margin-top:2px;line-height:1.4;text-wrap:pretty\">7 days before → day of. Mood blue = low, coral = great · darker sleep = better · darker stress = higher.<\u002Fdiv>\n<sc-for list=\"{{ rep.m.list }}\" as=\"g\" hint-placeholder-count=\"3\">\n<div data-avoid=\"\" style=\"border-top:1px solid #EFE7DB;padding:10px 0 8px;margin-top:8px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13px;font-weight:600\">{{ g.date }}<\u002Fspan><span style=\"font-size:11px;color:#6E6259\">{{ g.phase }}<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top:4px\"><div style=\"display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px;align-items:center;margin-top:3px\"><span style=\"font-size:10px;color:#8A7E74\">Mood<\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px\"><sc-for list=\"{{ g.mood }}\" as=\"c\" hint-placeholder-count=\"8\"><div style=\"height:10px;border-radius:2px;background:{{ c.bg }}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px;align-items:center;margin-top:3px\"><span style=\"font-size:10px;color:#8A7E74\">Sleep<\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px\"><sc-for list=\"{{ g.sleep }}\" as=\"c\" hint-placeholder-count=\"8\"><div style=\"height:10px;border-radius:2px;background:{{ c.bg }}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px;align-items:center;margin-top:3px\"><span style=\"font-size:10px;color:#8A7E74\">Stress<\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px\"><sc-for list=\"{{ g.stress }}\" as=\"c\" hint-placeholder-count=\"8\"><div style=\"height:10px;border-radius:2px;background:{{ c.bg }}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<sc-if value=\"{{ g.hasMeds }}\"><div style=\"display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px;margin-top:6px;align-items:baseline\"><span style=\"font-size:10px;color:#8A7E74\">Meds<\u002Fspan><span style=\"font-size:11.5px;line-height:1.4;color:#2B2320;text-wrap:pretty\">{{ g.medLine }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n<sc-for list=\"{{ g.notes }}\" as=\"n\" hint-placeholder-count=\"2\"><div style=\"font-size:11.5px;line-height:1.4;margin-top:5px;text-wrap:pretty\"><span style=\"color:#8A7E74;font-size:10.5px\">{{ n.when }} · <\u002Fspan>“{{ n.text }}”<\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsc-if>\n\n<div style=\"margin-top:22px;padding-top:8px;border-top:1px solid #E3D9CB;font-size:10px;color:#8A7E74;line-height:1.45\">Self-reported in Almanac. Patterns here are correlations, not a diagnosis — useful to discuss with your GP or specialist.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div data-noprint=\"1\" style=\"position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(250,246,239,.94);backdrop-filter:blur(14px);border-top:1px solid #E6DCCD;padding:8px 14px 30px;display:flex;gap:6px\">\n<button sc-camel-on-click=\"{{ tabs.today.onClick }}\" style=\"flex:1;height:50px;border-radius:14px;border:none;background:{{ tabs.today.bg }};color:{{ tabs.today.color }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:11px;font-weight:600\">\n<span style=\"width:15px;height:14px;border:1.5px solid currentColor;border-top-width:3.5px;border-radius:3px;box-sizing:border-box\"><\u002Fspan>Today<\u002Fbutton>\n<button sc-camel-on-click=\"{{ tabs.cal.onClick }}\" style=\"flex:1;height:50px;border-radius:14px;border:none;background:{{ tabs.cal.bg }};color:{{ tabs.cal.color }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:11px;font-weight:600\">\n<span style=\"width:15px;height:15px;border:1.5px solid currentColor;border-radius:50%;box-sizing:border-box\"><\u002Fspan>Calendar<\u002Fbutton>\n<button sc-camel-on-click=\"{{ tabs.trends.onClick }}\" style=\"flex:1;height:50px;border-radius:14px;border:none;background:{{ tabs.trends.bg }};color:{{ tabs.trends.color }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:11px;font-weight:600\">\n<span style=\"display:flex;align-items:flex-end;gap:2px;height:14px\"><span style=\"width:3px;height:7px;background:currentColor;border-radius:1px\"><\u002Fspan><span style=\"width:3px;height:14px;background:currentColor;border-radius:1px\"><\u002Fspan><span style=\"width:3px;height:10px;background:currentColor;border-radius:1px\"><\u002Fspan><\u002Fspan>Trends<\u002Fbutton>\n<div data-hi=\"1\" style=\"position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#1E1A18\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showSectionStrip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Today&quot;},&quot;startCollapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Today&quot;}}\">\nconst LS='almanac-proto-v6';\nconst PRN=['Ibuprofen','Paracetamol','Antihistamine'];\nconst wk=e=>e?(e.workouts||(e.moved&&e.sport?[{id:'l',sport:e.sport,mins:e.mins||30,intensity:e.intensity,note:e.moveNote||'',source:'manual'}]:[])):[];\nconst FUND=['3 main meals & 3L water','Connected with someone you love','Moved your body outside, 45 min','1 hour of play, no screens','Honoured your needs (eat, pee, sleep)'];\nconst FUND_SHORT=['Meals & water','Connection','Outside, 45 min','Screen-free play','Honoured needs'];\nconst MOOD_TAGS=['Anxious','Irritable','Low','Calm','Content','Overwhelmed','Energetic','Sad','Tearful','Focused','Motivated','Foggy','Restless','Numb'];\nconst MH_TAGS=['Foggy','Focused','Motivated','Numb','Stressed','Resilient','Restless','Clear-headed'];\nconst SYM=['Cramps','Bloating','Hot flash','Night sweats','Brain fog','Fatigue','Breast tenderness','Joint pain','Nausea','Breakouts','Cravings'];\nconst SPORTS=['Run','Walk','Yoga','Swim','Cycle','Strength','Dance'];\nconst MONTHS=['Jan','Feb','Mar','Apr','May','June','July','Aug','Sept','Oct','Nov','Dec'];\nconst MONTHS_L=['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\nconst MOODC={1:'#A7AFD0',2:'#C7B6D6',3:'#EBD3C2',4:'#F2B3A6',5:'#E7878F'};\nconst TH={pink:{bg:'#F7D9DF',bd:'#D98B9C'},grey:{bg:'#E8E3E7',bd:'#9D93A3'},ink:{bg:'#EDE8E2',bd:'#2B2320'},blue:{bg:'#DCE5EE',bd:'#8EA4BA'},sage:{bg:'#DAE8DE',bd:'#84A78E'},peach:{bg:'#F8E0C6',bd:'#D6A06A'},teal:{bg:'#DCEBEC',bd:'#79A3A6'}};\nconst OFF={bg:'#FFFDF9',bd:'#E3D9CB'};\nconst pad=n=>String(n).padStart(2,'0');\nconst keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());\nconst parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};\nconst add=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return keyOf(d);};\nconst diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);\nconst fmt=k=>{const d=parse(k);return WD[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()];};\nconst avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;\nconst PH={men:{c:'#E9A9B6',n:'Menstrual'},fol:{c:'#DCE8DA',n:'Follicular'},ovu:{c:'#CDBBDD',n:'Ovulatory'},lut:{c:'#F2DFC6',n:'Luteal'}};\nconst FLOWC={Light:'#F4C9D2',Medium:'#E9A3B2',Heavy:'#D9788E','Very heavy':'#B8506A'};\nconst SLEEPC={1:'#E6ECF2',2:'#C9D6E2',3:'#A9BDD0',4:'#8EA4BA',5:'#6B849E'};\nconst STRESSC={1:'#EEEAEF',2:'#D8D1DB',3:'#BDB2C3',4:'#9D93A3',5:'#76697E'};\nconst THEMES=[['Poor sleep',['slept badly','woke','awake','restless','switch off','insomnia']],['Stress & deadlines',['deadline','stress','wired','call','busy']],['Screens',['screen']],['Skipped meals / water',['skipped','lunch','water','hungry']],['Alcohol',['wine','beer','drink']],['Neck & shoulders',['neck','shoulder','tense','tight']]];\nconst texts=e=>e?[e.moodNote,e.mhNote,e.sleepNote,e.symNote,e.diary,...wk(e).map(w=>w.note)].filter(Boolean):[];\nconst fmtY=k=>{const d=parse(k);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();};\nconst fmtS=k=>{const d=parse(k);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);};\nconst f1=x=>x==null?'—':x.toFixed(1);\nconst pctl=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(p*(s.length-1)+.5))];};\nfunction timing(cs,D,test,P,L){\n  const occ=[];cs.forEach(c=>{for(let d=1;d<=c.days;d++){const e=D[add(c.s,d-1)];if(e&&test(e))occ.push({d,b:c.len?c.len-d+1:(L-d+1)});}});\n  if(occ.length<3)return null;\n  const B={period:[],post:[],ovu:[],mid:[],pre:[]};\n  occ.forEach(o=>{if(o.d<=P+1)B.period.push(o.d);else if(o.b>=1&&o.b<=7)B.pre.push(o.b);else if(o.d>=L-17&&o.d<=L-11)B.ovu.push(o.d);else if(o.d<L-17)B.post.push(o.d);else B.mid.push(o.d);});\n  const ok=k=>B[k].length>=2&&B[k].length/occ.length>=.2,out=[];\n  if(ok('post'))out.push('in the week after your period');\n  if(ok('ovu'))out.push('around ovulation');\n  if(ok('mid'))out.push('in the second half of your cycle');\n  if(ok('pre')){const n=pctl(B.pre,.8);out.push(n<=1?'the day before your period starts':'for the '+n+' days before your period starts');}\n  if(ok('period')){const n=Math.min(P,pctl(B.period,.8));out.push(n<=1?'on the first day of your period':'in the first '+n+' days of your period');}\n  if(!out.length)return 'no clear timing in your cycle';\n  return out.length===1?out[0]:out.slice(0,-1).join(', ')+' and '+out[out.length-1];\n}\nconst DEMO='demo@almanac.app';\nconst hsh=s=>{let h=5381;for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;return h.toString(36);};\nconst getUsers=()=>{try{return JSON.parse(localStorage.getItem(LS+':users'))||{};}catch(e){return{};}};\nconst EMPTY_AUTH={mode:'in',email:'',pw:'',name:'',err:''};\nfunction rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul
